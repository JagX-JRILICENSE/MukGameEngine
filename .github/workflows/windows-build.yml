name: Windows Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Muk (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DMUK_USE_IMGUI=OFF -DMUK_USE_TINYGLTF=OFF -DMUK_USE_JOLT=OFF -DMUK_BUILD_SAMPLES=OFF -DMUK_BUILD_EDITOR=ON

      - name: Build Release
        shell: cmd
        run: |
          cmake --build build --config Release --parallel 4 -- /v:m /fl /flp:logfile=build\msbuild.log;verbosity=minimal
          if errorlevel 1 (
            echo ===== MSBUILD LOG TAIL =====
            powershell -Command "if (Test-Path build\msbuild.log) { Get-Content build\msbuild.log -Tail 120 }"
            exit /b 1
          )

      - name: Locate and package
        id: pkg
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path build -Recurse -Filter "MukEditor.exe" | Select-Object -First 1
          if (-not $found) { throw "MukEditor.exe missing" }
          $out = "MukGameEngine-Windows-x64"
          New-Item -ItemType Directory -Force -Path "$out/bin" | Out-Null
          Copy-Item $found.FullName "$out/bin/MukEditor.exe"
          Copy-Item $found.FullName "$out/bin/Muk Game Engine.exe"
          $rt = Get-ChildItem -Path build -Recurse -Filter "MukRuntime.exe" | Select-Object -First 1
          if ($rt) { Copy-Item $rt.FullName "$out/bin/MukRuntime.exe" }
          "Windows desktop build (not Android APK). Run bin\MukEditor.exe" | Set-Content "$out/INSTALL.txt"
          Copy-Item README.md $out/ -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: MukGameEngine-Windows-x64
          path: MukGameEngine-Windows-x64
          retention-days: 30
