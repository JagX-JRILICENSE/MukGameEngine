name: Windows Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Muk (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        shell: cmd
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DMUK_BUILD_EDITOR=ON -DMUK_BUILD_ENGINE=OFF

      - name: Build Release
        shell: cmd
        run: cmake --build build --config Release --parallel 4

      - name: Package real app
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter "MukEditor.exe" | Select-Object -First 1
          if (-not $exe) { throw "MukEditor.exe missing" }
          $size = $exe.Length
          Write-Host "MukEditor.exe = $size bytes"
          if ($size -lt 80000) { throw "Exe too small ($size) — expected real DX12 app" }
          $out = "MukGameEngine-Windows-x64"
          New-Item -ItemType Directory -Force -Path "$out/bin" | Out-Null
          Copy-Item $exe.FullName "$out/bin/MukEditor.exe"
          Copy-Item $exe.FullName "$out/bin/Muk Game Engine.exe"
          @"
          Muk Game Engine — REAL Windows app
          ==================================
          Double-click:  bin\Muk Game Engine.exe

          You should see a window titled "Muk Game Engine"
          with a dark blue background and a colored triangle.

          Close the window with the X button.

          This is a Windows DirectX 12 desktop application
          (NOT an Android APK, NOT a MessageBox stub).
          "@ | Set-Content "$out/INSTALL.txt"
          Copy-Item README.md $out/ -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: MukGameEngine-Windows-x64
          path: MukGameEngine-Windows-x64
          retention-days: 30
