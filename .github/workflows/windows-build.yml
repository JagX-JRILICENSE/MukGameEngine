name: Windows Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Muk (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        shell: cmd
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DMUK_BUILD_EDITOR=ON -DMUK_BUILD_ENGINE=OFF

      - name: Build Release
        shell: cmd
        run: cmake --build build --config Release --parallel 4

      - name: Package real app
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Recurse -Filter "*.exe" | ForEach-Object { Write-Host "$($_.FullName) $($_.Length) bytes" }
          $exe = Get-ChildItem -Path build -Recurse -Filter "MukEditor.exe" | Select-Object -First 1
          if (-not $exe) { throw "MukEditor.exe missing" }
          $size = $exe.Length
          Write-Host "MukEditor.exe = $size bytes"
          # Real DX12 app is typically 50KB–500KB; reject only the old ~10KB MessageBox stub
          if ($size -lt 20000) { throw "Exe too small ($size) — looks like stub" }
          $out = "MukGameEngine-Windows-x64"
          New-Item -ItemType Directory -Force -Path "$out/bin" | Out-Null
          Copy-Item $exe.FullName "$out/bin/MukEditor.exe"
          Copy-Item $exe.FullName "$out/bin/Muk Game Engine.exe"
          @"
          Muk Game Engine — REAL Windows app
          ==================================
          Double-click:  bin\Muk Game Engine.exe

          Expected: a window titled "Muk Game Engine"
          dark blue background + colored triangle.

          Close with the X button.
          Windows DirectX 12 desktop app (not Android, not MessageBox).
          "@ | Set-Content "$out/INSTALL.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: MukGameEngine-Windows-x64
          path: MukGameEngine-Windows-x64
          retention-days: 30
