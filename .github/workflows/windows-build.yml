name: Windows Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Muk (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        shell: cmd
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DMUK_BUILD_EDITOR=ON -DMUK_BUILD_ENGINE=OFF

      - name: Build Release
        shell: cmd
        run: cmake --build build --config Release --parallel 4

      - name: Package real app
        shell: pwsh
        run: |
          Write-Host "Listing all EXEs under build:"
          $all = @(Get-ChildItem -Path build -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue)
          foreach ($f in $all) { Write-Host "  $($f.FullName)  size=$($f.Length)" }
          if ($all.Count -eq 0) { throw "No .exe produced" }
          # Prefer MukEditor, else largest exe
          $exe = $all | Where-Object { $_.Name -match 'Muk' } | Select-Object -First 1
          if (-not $exe) { $exe = $all | Sort-Object Length -Descending | Select-Object -First 1 }
          Write-Host "Packaging: $($exe.FullName) ($($exe.Length) bytes)"
          $out = "MukGameEngine-Windows-x64"
          New-Item -ItemType Directory -Force -Path "$out/bin" | Out-Null
          Copy-Item $exe.FullName "$out/bin/MukEditor.exe" -Force
          Copy-Item $exe.FullName "$out/bin/Muk Game Engine.exe" -Force
          "Muk Game Engine - Windows DX12 app`nRun bin\Muk Game Engine.exe`nExpect a window with a colored triangle." | Set-Content "$out/INSTALL.txt"
          Get-ChildItem $out -Recurse | ForEach-Object { Write-Host $_.FullName }

      - uses: actions/upload-artifact@v4
        with:
          name: MukGameEngine-Windows-x64
          path: MukGameEngine-Windows-x64
          retention-days: 30
