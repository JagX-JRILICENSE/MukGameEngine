name: Windows Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Muk (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        shell: cmd
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DMUK_BUILD_EDITOR=ON -DMUK_BUILD_ENGINE=OFF

      - name: Build Release
        shell: cmd
        run: cmake --build build --config Release --parallel 4

      - name: Package real app
        shell: pwsh
        run: |
          $all = @(Get-ChildItem -Path build -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue)
          foreach ($f in $all) { Write-Host "EXE: $($f.FullName)  $($f.Length) bytes" }
          if ($all.Count -eq 0) { throw "No .exe produced" }
          $exe = $all | Where-Object { $_.Name -match 'Muk' } | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { $exe = $all | Sort-Object Length -Descending | Select-Object -First 1 }
          Write-Host "Selected: $($exe.FullName) size=$($exe.Length)"
          # Real /MT DX12 app should be well above MessageBox stub (~10KB)
          if ($exe.Length -lt 100000) {
            throw "Refusing to ship tiny exe ($($exe.Length) bytes). Expected >100KB real app."
          }
          $out = "MukGameEngine-Windows-x64"
          New-Item -ItemType Directory -Force -Path "$out/bin" | Out-Null
          Copy-Item $exe.FullName "$out/bin/MukEditor.exe" -Force
          Copy-Item $exe.FullName "$out/bin/Muk Game Engine.exe" -Force
          @"
          Muk Game Engine — REAL Windows DirectX 12 app
          ==============================================
          Size of exe should be 100KB+ (not 13–17KB stub).

          Run:  bin\Muk Game Engine.exe

          You should see:
            - Window titled "Muk Game Engine | DX12 Demo"
            - Dark scene with colored cubes on a floor
            - Camera slowly orbiting
            - FPS in the title bar
            - ESC to quit
          "@ | Set-Content "$out/INSTALL.txt"
          Write-Host "Package OK — $($exe.Length) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: MukGameEngine-Windows-x64
          path: MukGameEngine-Windows-x64
          retention-days: 30
