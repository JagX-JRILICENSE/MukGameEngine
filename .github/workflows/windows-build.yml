name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  build:
    name: Build Muk (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show toolchain
        shell: pwsh
        run: |
          cmake --version
          where cl
          Write-Host "VSINSTALLDIR=$env:VSINSTALLDIR"

      - name: Configure CMake
        shell: pwsh
        run: |
          # Prefer default generator detected by CMake (VS 2022/2025)
          $args = @(
            "-B", "build",
            "-A", "x64",
            "-DMUK_USE_IMGUI=ON",
            "-DMUK_USE_TINYGLTF=ON",
            "-DMUK_USE_JOLT=OFF",
            "-DMUK_BUILD_SAMPLES=OFF",
            "-DMUK_BUILD_EDITOR=ON"
          )
          Write-Host "cmake $($args -join ' ')"
          & cmake @args
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Retry with explicit VS 17 2022…"
            & cmake -B build -G "Visual Studio 17 2022" -A x64 `
              -DMUK_USE_IMGUI=ON -DMUK_USE_TINYGLTF=ON -DMUK_USE_JOLT=OFF `
              -DMUK_BUILD_SAMPLES=OFF -DMUK_BUILD_EDITOR=ON
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Retry Ninja…"
            choco install ninja -y --no-progress
            & cmake -B build-ninja -G Ninja -DCMAKE_BUILD_TYPE=Release `
              -DMUK_USE_IMGUI=ON -DMUK_USE_TINYGLTF=ON -DMUK_USE_JOLT=OFF `
              -DMUK_BUILD_SAMPLES=OFF -DMUK_BUILD_EDITOR=ON
            if ($LASTEXITCODE -eq 0) {
              "USE_NINJA=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release
        shell: pwsh
        run: |
          if ($env:USE_NINJA -eq "1") {
            cmake --build build-ninja --parallel 4
          } else {
            cmake --build build --config Release --parallel 4
          }

      - name: Locate binaries
        id: bins
        shell: pwsh
        run: |
          $roots = @("build", "build-ninja")
          $foundEditor = $null
          $foundRuntime = $null
          foreach ($root in $roots) {
            if (-not (Test-Path $root)) { continue }
            Get-ChildItem -Path $root -Recurse -Filter "MukEditor.exe" -ErrorAction SilentlyContinue |
              ForEach-Object { if (-not $foundEditor) { $foundEditor = $_.FullName } }
            Get-ChildItem -Path $root -Recurse -Filter "MukRuntime.exe" -ErrorAction SilentlyContinue |
              ForEach-Object { if (-not $foundRuntime) { $foundRuntime = $_.FullName } }
            # Also match renamed output
            Get-ChildItem -Path $root -Recurse -Filter "Muk Game Engine.exe" -ErrorAction SilentlyContinue |
              ForEach-Object { if (-not $foundEditor) { $foundEditor = $_.FullName } }
          }
          Get-ChildItem -Path build,build-ninja -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.FullName }
          if (-not $foundEditor) {
            Write-Error "MukEditor.exe not found after build"
            exit 1
          }
          "editor=$foundEditor" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($foundRuntime) {
            "runtime=$foundRuntime" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Stage install package
        shell: pwsh
        run: |
          $out = "MukGameEngine-Windows-x64"
          New-Item -ItemType Directory -Force -Path "$out/bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$out/config" | Out-Null
          New-Item -ItemType Directory -Force -Path "$out/Assets/Scripts" | Out-Null

          $editor = "${{ steps.bins.outputs.editor }}"
          $runtime = "${{ steps.bins.outputs.runtime }}"
          Copy-Item $editor "$out/bin/MukEditor.exe" -Force
          # Friendly name copy
          Copy-Item $editor "$out/bin/Muk Game Engine.exe" -Force
          if ($runtime) { Copy-Item $runtime "$out/bin/MukRuntime.exe" -Force }

          $editorDir = Split-Path $editor -Parent
          Get-ChildItem $editorDir -Filter "*.dll" -ErrorAction SilentlyContinue |
            Copy-Item -Destination "$out/bin/" -Force

          if (Test-Path "Resources/muk.ico") {
            Copy-Item "Resources/muk.ico" "$out/bin/" -Force
          }

          Copy-Item README.md "$out/" -ErrorAction SilentlyContinue
          Copy-Item LICENSE "$out/" -ErrorAction SilentlyContinue
          Copy-Item ROADMAP.md "$out/" -ErrorAction SilentlyContinue
          if (Test-Path "config/settings.example.ini") {
            Copy-Item "config/settings.example.ini" "$out/config/"
          }

          @"
          Muk Game Engine — Windows x64
          =============================
          Run: bin\Muk Game Engine.exe  (or MukEditor.exe)

          AI: set OpenRouter + NVIDIA keys in AI Control panel
          F5 Play-In-Editor | F9 reload script | F12 screenshot
          "@ | Set-Content -Encoding utf8 "$out/INSTALL.txt"

          if (-not (Test-Path "$out/bin/MukEditor.exe")) { exit 1 }
          Get-ChildItem -Recurse $out | Select-Object FullName, Length

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MukGameEngine-Windows-x64
          path: MukGameEngine-Windows-x64
          if-no-files-found: error
          retention-days: 30
