name: Windows Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Muk (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        shell: cmd
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DMUK_BUILD_EDITOR=ON -DMUK_BUILD_ENGINE=OFF

      - name: Build Release
        shell: cmd
        run: cmake --build build --config Release --parallel 4

      - name: Package real editor
        shell: pwsh
        run: |
          $all = @(Get-ChildItem -Path build -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue)
          foreach ($f in $all) { Write-Host "EXE $($f.FullName) $($f.Length) bytes" }
          $exe = $all | Where-Object { $_.Name -match 'Muk' } | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { $exe = $all | Sort-Object Length -Descending | Select-Object -First 1 }
          if (-not $exe) { throw "No exe" }
          Write-Host "Packaging $($exe.FullName) size=$($exe.Length)"
          if ($exe.Length -lt 200000) { throw "Exe too small $($exe.Length) — expect ImGui editor >200KB" }
          $out = "MukGameEngine-Windows-x64"
          New-Item -ItemType Directory -Force -Path "$out/bin" | Out-Null
          Copy-Item $exe.FullName "$out/bin/MukEditor.exe"
          Copy-Item $exe.FullName "$out/bin/Muk Game Engine.exe"
          @"
          Muk Game Engine — REAL EDITOR
          =============================
          Run: bin\Muk Game Engine.exe

          Panels:
            Hierarchy — select / create entities
            Details — edit position, scale, color
            Viewport — camera controls
            Console — log
            AI Control — paste OpenRouter or NVIDIA API key

          Menu: Create → Floor / Cubes
          AI prompt tips: "spawn cube" / "add floor"
          "@ | Set-Content "$out/INSTALL.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: MukGameEngine-Windows-x64
          path: MukGameEngine-Windows-x64
          retention-days: 30
