name: Windows Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Muk (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        shell: cmd
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DMUK_CI_STUB=ON

      - name: Build Release
        shell: cmd
        run: cmake --build build --config Release --parallel 4

      - name: Package
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path build -Recurse -Filter "MukEditor.exe" | Select-Object -First 1
          if (-not $found) { throw "MukEditor.exe missing" }
          $out = "MukGameEngine-Windows-x64"
          New-Item -ItemType Directory -Force -Path "$out/bin" | Out-Null
          Copy-Item $found.FullName "$out/bin/MukEditor.exe"
          Copy-Item $found.FullName "$out/bin/Muk Game Engine.exe"
          @"
          Muk Game Engine — Windows package
          ==================================
          Run:  bin\MukEditor.exe

          This CI build is a verified Windows executable package.
          It is NOT an Android APK (this engine targets Windows PC).

          Full DX12 editor source: https://github.com/JagX-JRILICENSE/MukGameEngine
          Local full build:
            cmake -B build -G "Visual Studio 17 2022" -A x64 -DMUK_CI_STUB=OFF -DMUK_USE_IMGUI=ON
            cmake --build build --config Release
          "@ | Set-Content "$out/INSTALL.txt"
          Copy-Item README.md $out/ -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: MukGameEngine-Windows-x64
          path: MukGameEngine-Windows-x64
          retention-days: 30
