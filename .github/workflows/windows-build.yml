name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  build:
    name: Build Muk (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show toolchain
        shell: pwsh
        run: |
          cmake --version
          where.exe cl 2>$null
          where.exe cmake 2>$null

      - name: Configure CMake
        shell: pwsh
        run: |
          $common = @(
            "-DMUK_USE_IMGUI=ON",
            "-DMUK_USE_TINYGLTF=ON",
            "-DMUK_USE_JOLT=OFF",
            "-DMUK_BUILD_SAMPLES=OFF",
            "-DMUK_BUILD_EDITOR=ON"
          )
          $ok = $false
          foreach ($gen in @("Visual Studio 17 2022", "Visual Studio 18 2025", "Visual Studio 16 2019")) {
            Write-Host "Trying generator: $gen"
            if (Test-Path build) { Remove-Item -Recurse -Force build }
            & cmake -B build -G $gen -A x64 @common
            if ($LASTEXITCODE -eq 0) { $ok = $true; "GENERATOR=$gen" | Out-File $env:GITHUB_ENV -Append -Encoding utf8; break }
          }
          if (-not $ok) {
            Write-Host "Falling back to Ninja"
            choco install ninja -y --no-progress
            if (Test-Path build) { Remove-Item -Recurse -Force build }
            & cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release @common
            if ($LASTEXITCODE -eq 0) {
              $ok = $true
              "USE_NINJA=1" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          if (-not $ok) {
            Write-Error "CMake configure failed for all generators"
            exit 1
          }
          Write-Host "Configure OK"

      - name: Build Release
        shell: pwsh
        run: |
          if ($env:USE_NINJA -eq "1") {
            cmake --build build --parallel 4
          } else {
            cmake --build build --config Release --parallel 4
          }

      - name: Locate binaries
        id: bins
        shell: pwsh
        run: |
          $foundEditor = $null
          $foundRuntime = $null
          Get-ChildItem -Path build -Recurse -Filter "MukEditor.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { if (-not $foundEditor) { $foundEditor = $_.FullName } }
          Get-ChildItem -Path build -Recurse -Filter "MukRuntime.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { if (-not $foundRuntime) { $foundRuntime = $_.FullName } }
          Get-ChildItem -Path build -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.FullName }
          if (-not $foundEditor) {
            Write-Error "MukEditor.exe not found"
            exit 1
          }
          "editor=$foundEditor" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($foundRuntime) { "runtime=$foundRuntime" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8 }

      - name: Stage install package
        shell: pwsh
        run: |
          $out = "MukGameEngine-Windows-x64"
          New-Item -ItemType Directory -Force -Path "$out/bin","$out/config","$out/Assets/Scripts" | Out-Null
          $editor = "${{ steps.bins.outputs.editor }}"
          $runtime = "${{ steps.bins.outputs.runtime }}"
          Copy-Item $editor "$out/bin/MukEditor.exe" -Force
          Copy-Item $editor "$out/bin/Muk Game Engine.exe" -Force
          if ($runtime) { Copy-Item $runtime "$out/bin/MukRuntime.exe" -Force }
          $dir = Split-Path $editor -Parent
          Get-ChildItem $dir -Filter "*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$out/bin/" -Force
          Copy-Item README.md,LICENSE,ROADMAP.md $out/ -ErrorAction SilentlyContinue
          if (Test-Path config/settings.example.ini) { Copy-Item config/settings.example.ini $out/config/ }
          "Muk Game Engine`nRun bin\Muk Game Engine.exe" | Set-Content "$out/INSTALL.txt"
          if (-not (Test-Path "$out/bin/MukEditor.exe")) { exit 1 }

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MukGameEngine-Windows-x64
          path: MukGameEngine-Windows-x64
          if-no-files-found: error
          retention-days: 30
