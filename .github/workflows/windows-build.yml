name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Muk (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake (full features)
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DMUK_USE_IMGUI=ON `
            -DMUK_USE_TINYGLTF=ON `
            -DMUK_USE_JOLT=ON `
            -DMUK_BUILD_SAMPLES=OFF

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Stage install package
        shell: pwsh
        run: |
          $out = "MukGameEngine-Windows-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          New-Item -ItemType Directory -Force -Path "$out/bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$out/config" | Out-Null

          $bin = "build/bin/Release"
          if (-not (Test-Path $bin)) { $bin = "build/bin" }

          Copy-Item "$bin/MukRuntime.exe" "$out/bin/" -ErrorAction SilentlyContinue
          Copy-Item "$bin/MukEditor.exe" "$out/bin/" -ErrorAction SilentlyContinue
          Get-ChildItem $bin -Filter "*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$out/bin/"

          Copy-Item README.md "$out/" -ErrorAction SilentlyContinue
          Copy-Item LICENSE "$out/" -ErrorAction SilentlyContinue
          Copy-Item ROADMAP.md "$out/" -ErrorAction SilentlyContinue

          @"
          provider=openrouter
          openrouter_api_key=
          openrouter_model=openai/gpt-4o-mini
          nvidia_api_key=
          openai_api_key=
          "@ | Set-Content -Encoding utf8 "$out/config/settings.example.ini"

          @"
          Muk Game Engine v0.5 — Windows
          ================================
          bin\MukEditor.exe  — shadows, ImGuizmo (T/R/Y), WASD character, AI BYOK
          bin\MukRuntime.exe — runtime loop

          Character: WASD move, Space jump
          Gizmo: select entity, T translate / R rotate / Y scale
          Physics: Jolt when built with MUK_USE_JOLT=ON
          "@ | Set-Content -Encoding utf8 "$out/INSTALL.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MukGameEngine-Windows-x64
          path: MukGameEngine-Windows-x64
          if-no-files-found: warn

      - name: List binaries
        shell: pwsh
        run: Get-ChildItem -Recurse build/bin -ErrorAction SilentlyContinue | Select-Object FullName
