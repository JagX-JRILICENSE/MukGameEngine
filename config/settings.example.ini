# Muk Game Engine — Bring Your Own Key (BYOK)
# Copy to %APPDATA%\MukGameEngine\settings.ini on Windows
# NEVER commit real API keys

# openrouter | nvidia | openai | custom
provider=openrouter

openrouter_api_key=
openrouter_model=openai/gpt-4o-mini
