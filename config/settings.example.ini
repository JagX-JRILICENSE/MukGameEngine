# Muk Game Engine — Bring Your Own Key
# Copy to %APPDATA%\MukGameEngine\settings.ini
# NEVER commit real API keys

# openrouter | nvidia | openai | custom
provider=openrouter

# --- OpenRouter FREE models (https://openrouter.ai/keys) ---
# Pick any :free model in the editor AI panel
openrouter_api_key=
openrouter_model=nvidia/nemotron-3.5-lightning:free
openrouter_base_url=https://openrouter.ai/api/v1

# Other free OpenRouter examples:
# openrouter_model=nvidia/nemotron-3-ultra-550b-a55b:free
# openrouter_model=google/gemma-4-31b-it:free
# openrouter_model=openrouter/free

# --- NVIDIA free/credit tier (https://build.nvidia.com → Get API Key) ---
nvidia_api_key=
nvidia_base_url=https://integrate.api.nvidia.com/v1
nvidia_model=meta/llama-3.1-8b-instruct

# --- OpenAI (paid) ---
openai_api_key=
openai_base_url=https://api.openai.com/v1
openai_model=gpt-4o-mini

custom_api_key=
custom_base_url=
custom_model=
